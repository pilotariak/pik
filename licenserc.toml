[header]
path = "hack/header.txt"

[files]
includes = [
  "*.rs",
  "*.yml",
  "*.yaml",
  "*.toml",
  "*.sh",
  "*.jsonc",
  "*.sql",
  "*.mjs",
  "*.html",
  "Makefile",
]

excludes = [
  "hack/header.txt",
  "*.json",
  "vendor/*",
  "node_modules/*",
  "target/*",
  "build/*",
  ".wrangler/*",
  ".git/*",
]

# hawkeye has no built-in comment style for these extensions.
[[rules]]
extensions = ["jsonc", "mjs"]
style_out = "doubleslash"
