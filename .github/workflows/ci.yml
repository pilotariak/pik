# ---
# # yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Project / CI

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

# Deny all permissions at workflow level
permissions: {}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Installs the channel, components and wasm32 target pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      run: rustup toolchain install

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

    - name: Rust unit tests
      run: cargo test

    # Same version as the wrangler.jsonc build command.
    - name: Install worker-build
      run: cargo install --locked worker-build@0.9.0

    - name: Build Worker
      run: worker-build --release

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - name: Install dependencies
      run: npm ci

    - name: Apply D1 migrations locally
      run: npm run migrate:local

    - name: Worker tests
      run: npm test
