# ---
# # yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Project / Release

on: # yamllint disable-line rule:truthy
  push:
    branches:
    - main

# Deny all permissions at workflow level
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push tags and changelog
      issues: write # (optional) for any issue linkage
      pull-requests: write # to create/modify the release PR
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    # release-please works through the GitHub API with the token below, not with git.
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Run Release Please Action
      uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
      id: release
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target-branch: ${{ github.ref_name }}
        config-file: .github/release-please-config.json

    # The API contract of the release, for Kancha to generate its types from: the openapi.json of
    # the released commit, which CI checked against the code.
    - name: Publish openapi.json with the release
      if: ${{ steps.release.outputs.release_created }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ steps.release.outputs.tag_name }}
      run: gh release upload "${TAG_NAME}" openapi.json --clobber
