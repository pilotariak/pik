# ---
# # yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security / CodeQL

on: # yamllint disable-line rule:truthy
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  # Weekly on Mondays.
  - cron: '30 1 * * 1'

# Deny all permissions at workflow level
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
        # build-mode none: CodeQL reads the crate with rust-analyzer and needs rustup and
        # cargo, preinstalled on the runner. It uses its own toolchain and the host target,
        # where the crate builds too (cargo test runs there).
        - language: rust
          build-mode: none
        # The Worker tests (tests/*.mjs). HTML files such as src/web/landing.html may be
        # analyzed with them.
        - language: javascript-typescript
          build-mode: none
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: "/language:${{ matrix.language }}"
