[package]
name = "pik"
version = "0.0.0"
edition = "2024"
description = "Slots service for Kancha: weekly or fortnightly courts booked by a group of friends"
license = "Apache-2.0"
repository = "https://github.com/pilotariak/pik"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# A Worker has no system tz database: `jiff::tz::get!` (feature `static`) embeds Europe/Paris
# from jiff-tzdb at compile time, so a tzdata update needs a rebuild. The default features look
# for a system tz database and stay off. Never call `Timestamp::now()`: without the `js` feature
# it panics on wasm32-unknown-unknown. Take the time from the Worker and pass it in.
jiff = { version = "1.0.2", default-features = false, features = ["std", "static"] }
serde = { version = "1.0.229", features = ["derive"] }
worker = { version = "0.9.0", features = ["d1"] }

# `make check` runs clippy with -D warnings, so these warnings fail the build.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
