[package]
name = "pik"
version = "0.1.0"
edition = "2024"
description = "Slots service for Kancha: weekly or fortnightly courts booked by a group of friends"
license = "Apache-2.0"
repository = "https://github.com/pilotariak/pik"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Ids, invite codes and tokens come from the CSPRNG of the platform: Web Crypto
# (crypto.getRandomValues) on wasm32-unknown-unknown through the `wasm_js` feature, which needs
# no --cfg flag since getrandom 0.4, and the OS on the host for `cargo test`.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# NFC normalization of display names (members.name_key). The url crate of `worker` already
# compiles it, with the same feature, through idna.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
# A Worker has no system tz database: `jiff::tz::get!` (feature `static`) embeds Europe/Paris
# from jiff-tzdb at compile time, so a tzdata update needs a rebuild. The default features look
# for a system tz database and stay off. Never call `Timestamp::now()`: without the `js` feature
# it panics on wasm32-unknown-unknown. Take the time from the Worker and pass it in.
jiff = { version = "1.0.2", default-features = false, features = ["std", "static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Only the SHA-256 of a token or an Idempotency-Key is stored.
sha2 = { version = "0.11.1", default-features = false }
worker = { version = "0.9.0", features = ["d1"] }

[dev-dependencies]
# The OpenAPI document (openapi.json) is generated by a unit test from the #[utoipa::path]
# annotations, which only exist under cfg(test): the Worker does not serve it, so the wasm build
# carries no schema code. See src/api/openapi.rs.
utoipa = "6.0.0"

# `make check` runs clippy with -D warnings, so these warnings fail the build.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
